<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>클립보드 붙여넣기 진단</title>
<style>
  body{margin:24px;font:14px/1.6 system-ui,sans-serif;color:#203040}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 16px}
  iframe{display:block;width:100%;height:680px;border:1px solid #b9c8d3;border-radius:8px}
  pre{white-space:pre-wrap;background:#eef5fb;padding:14px;border-radius:8px}
</style>
<h1>클립보드 붙여넣기 진단</h1>
<p>다른 HWP 프로그램에서 복사한 내용을 아래 편집기에 붙여넣으세요. 이 화면은 문서 내용 대신 수신 형식과 표 개수만 표시합니다.</p>
<pre id="report">붙여넣기를 기다리는 중입니다.</pre>
<iframe id="editor-frame" title="붙여넣기 시험 편집기"></iframe>
<script type="module">
import { sanitizePastedHtml } from '../src/paste.js';

const frame = document.querySelector('#editor-frame');
const report = document.querySelector('#report');
frame.src = `../?migration-test=clipboard-audit-${Date.now()}`;
frame.addEventListener('load', () => {
  const documentInFrame = frame.contentDocument;
  documentInFrame.addEventListener('paste', event => {
    const data = event.clipboardData;
    if (!data) return;
    const html = data.getData('text/html');
    const plain = data.getData('text/plain');
    const rtf = data.getData('text/rtf');
    const rawDocument = new DOMParser().parseFromString(html, 'text/html');
    const rawTables = rawDocument.querySelectorAll('table').length;
    const rawImages = rawDocument.querySelectorAll('img').length;
    let cleanedTables = 0;
    let cleanedImages = 0;
    let cleanError = '';
    try {
      if (html) {
        const cleaned = new DOMParser().parseFromString(sanitizePastedHtml(html), 'text/html');
        cleanedTables = cleaned.querySelectorAll('table').length;
        cleanedImages = cleaned.querySelectorAll('img').length;
      }
    } catch (error) { cleanError = String(error); }
    const before = documentInFrame.querySelector('.jodit-wysiwyg');
    const beforeTables = before?.querySelectorAll('table').length || 0;
    const beforeImages = before?.querySelectorAll('img').length || 0;
    const imageFiles = [...data.items].filter(item => item.kind === 'file' && item.type.startsWith('image/')).length;
    const received = {
      형식:[...data.types], 항목:[...data.items].map(item => `${item.kind}:${item.type}`),
      HTML글자수:html.length, HTML표:rawTables, 정제후표:cleanedTables,
      HTML그림:rawImages, 정제후그림:cleanedImages, 이미지파일:imageFiles,
      일반텍스트글자수:plain.length, 탭수:(plain.match(/\t/g) || []).length,
      RTF글자수:rtf.length, 파일수:data.files.length,
    };
    setTimeout(() => {
      const after = documentInFrame.querySelector('.jodit-wysiwyg');
      const addedTables = (after?.querySelectorAll('table').length || 0) - beforeTables;
      const addedImages = (after?.querySelectorAll('img').length || 0) - beforeImages;
      const tableCause = cleanError ? `HTML 정제 오류: ${cleanError}`
        : rawTables && !cleanedTables ? '원본 HTML에는 표가 있지만 편집기 정제 단계에서 사라졌습니다.'
        : cleanedTables && addedTables <= 0 ? '정제 결과에는 표가 있지만 편집기 삽입 후 보이지 않습니다.'
        : cleanedTables && addedTables > 0 ? '표 구조가 편집기에 들어왔습니다. 모양이 다르면 폭·테두리·글꼴을 비교해야 합니다.'
        : !rawTables && rtf ? '브라우저가 HTML 표 없이 RTF를 전달했습니다. 현재 편집기는 RTF 표를 해석하지 않습니다.'
        : !rawTables ? '브라우저가 HTML 표를 전달하지 않았습니다. 텍스트만으로 원래 셀·병합 구조를 알 수 없습니다.'
        : '붙여넣기 결과를 확인해 주세요.';
      const imageCause = cleanError ? `HTML 정제 오류: ${cleanError}`
        : rawImages && !cleanedImages ? '원본 HTML의 그림 주소를 편집기에서 안전하게 사용할 수 없어 제거됐습니다.'
        : cleanedImages && addedImages <= 0 ? '정제 후 그림은 있지만 편집기 삽입 후 보이지 않습니다.'
        : cleanedImages && addedImages > 0 ? 'HTML 그림이 편집기에 들어왔습니다.'
        : imageFiles && addedImages > 0 ? '독립 이미지 파일이 편집기에 들어왔습니다.'
        : imageFiles && rawTables ? '이미지 파일은 HTML 표의 대체 표현일 수 있어 중복 추가하지 않았습니다.'
        : imageFiles ? '이미지 파일이 전달됐지만 편집기에 들어오지 않았습니다.'
        : '클립보드에 HTML 그림이나 이미지 파일이 없습니다. 복사 단계에서 누락됐습니다.';
      report.textContent = `${JSON.stringify(received, null, 2)}\n편집기에 추가된 표: ${addedTables}개, 그림: ${addedImages}개\n표 판정: ${tableCause}\n그림 판정: ${imageCause}`;
    }, 200);
  }, true);
});
</script>
