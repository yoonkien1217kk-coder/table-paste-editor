<!doctype html><html lang="ko"><meta charset="utf-8"><title>붙여넣기 분기 회귀 검사</title><pre id="results">검사 중</pre>
<script type="module">
const result = document.querySelector('#results');
const frame = document.createElement('iframe');
frame.src = `../?migration-test=paste-fallback-${Date.now()}`;
document.body.append(frame);
await new Promise(resolve => frame.addEventListener('load', resolve, { once:true }));
for (let i = 0; i < 100 && !frame.contentWindow.editorInstance; i++) await new Promise(resolve => setTimeout(resolve, 100));
const editor = frame.contentWindow.editorInstance;
const failures = [];
function paste(html, plain) {
  editor.value = '';
  editor.s.focus();
  const data = new frame.contentWindow.DataTransfer();
  if (html) data.setData('text/html', html);
  if (plain) data.setData('text/plain', plain);
  const event = new frame.contentWindow.ClipboardEvent('paste', { bubbles:true, cancelable:true, clipboardData:data });
  editor.editor.dispatchEvent(event);
  return { text:editor.editor.textContent, tables:editor.editor.querySelectorAll('table').length, bold:!!editor.editor.querySelector('strong,b'), prevented:event.defaultPrevented };
}
const table = paste('<table><tbody><tr><td>표 내용</td></tr></tbody></table>', '표 내용');
if (table.tables !== 1) failures.push('HTML 표');
const rich = paste('<p><strong>굵은 문장</strong></p>', '굵은 문장');
if (!rich.text.includes('굵은 문장') || !rich.bold) failures.push('표 없는 서식 HTML');
const invalidHtml = paste('<meta charset="utf-8">', '2. 휴대폰 번호\n<확인> & 동의');
if (!invalidHtml.text.includes('2. 휴대폰 번호\n<확인> & 동의') || frame.contentWindow.document.querySelector('.jodit-wysiwyg script')) failures.push('빈 HTML에서 원문 복구');
const plain = paste('', '일반 문장');
if (!plain.text.includes('일반 문장')) failures.push('텍스트만 있는 클립보드');
const tsv = paste('', '이름\t번호\n홍길동\t1234');
if (tsv.tables !== 1) failures.push('탭 구분 표');
result.textContent = `${failures.length ? `FAIL ${failures.join(', ')}` : 'ALL PASS'}\n${JSON.stringify({table,rich,invalidHtml,plain,tsv})}`;
frame.contentWindow.localStorage.removeItem(`table-paste-editor-test-${new URLSearchParams(frame.contentWindow.location.search).get('migration-test')}`);
frame.remove();
</script>
